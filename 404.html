<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply saved theme instantly, before first paint, to avoid a
    // flash of the wrong theme on load.
    (function () {
      try {
        if (localStorage.getItem('joyrise_theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Page Not Found — Joy-Rise Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c5ce7" />
  <link rel="icon" type="image/webp" href="favicon.webp" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    .notfound-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
      text-align: center;
    }

    .notfound-badge {
      width: 96px; height: 96px; border-radius: 28px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; color: #fff;
      box-shadow: 0 14px 32px rgba(108,92,231,0.35);
      margin-bottom: 26px;
      position: relative;
      animation: notfoundFloat 3.4s ease-in-out infinite;
    }
    .notfound-badge::after {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 36px;
      border: 2px dashed rgba(108,92,231,0.35);
      animation: notfoundSpin 14s linear infinite;
    }
    @keyframes notfoundFloat {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-10px) rotate(4deg); }
    }
    @keyframes notfoundSpin {
      to { transform: rotate(360deg); }
    }

    .notfound-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px; font-weight: 800; letter-spacing: 0.22em;
      color: #6c5ce7; margin-bottom: 8px; text-transform: uppercase;
    }
    .notfound-title {
      font-size: 20px; font-weight: 900; color: #1e1e24;
      margin-bottom: 10px; line-height: 1.3;
    }
    .notfound-text {
      font-size: 13px; color: #636e72; max-width: 280px;
      line-height: 1.55; margin-bottom: 30px;
    }
    .notfound-actions {
      display: flex; flex-direction: column; gap: 10px;
      width: 100%; max-width: 260px;
    }
    .notfound-actions .btn-auth-primary,
    .notfound-actions .btn-modal-cancel {
      width: 100%;
    }

    html[data-theme="dark"] .notfound-title { color: #F3F0FF; }
    html[data-theme="dark"] .notfound-text { color: #9C93B8; }

    @media (prefers-reduced-motion: reduce) {
      .notfound-badge, .notfound-badge::after { animation: none; }
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <div class="notfound-wrap entrance-stagger">
      <div class="notfound-badge"><i class="fa-solid fa-ticket"></i></div>
      <div class="notfound-code">Error 404</div>
      <h1 class="notfound-title">This ticket didn't win</h1>
      <p class="notfound-text">
        The page you're looking for doesn't exist, moved, or got drawn out.
        Let's get you back on track.
      </p>
      <div class="notfound-actions">
        <button class="btn-auth-primary" onclick="window.location.href='index.html'">
          <span>Back to Home</span>
        </button>
        <button class="btn-modal-cancel" onclick="window.location.href='buy-ticket.html'">
          <span>Buy a Ticket</span>
        </button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>

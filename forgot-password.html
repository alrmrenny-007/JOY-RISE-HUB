<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reset Password — Joy-Rise Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c5ce7" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="mobile-container auth-container">

    <div class="auth-header">
      <div class="logo-box">
        <div class="logo-badge">JR</div>
        <div class="logo-text">
          <span class="brand-name">JOY-RISE</span>
          <span class="brand-sub">HUB</span>
        </div>
      </div>
      <h1>Reset your password</h1>
      <p>Enter your email and we'll send you a reset link</p>
    </div>

    <form class="auth-form" id="forgot-form">
      <label class="auth-label">Email</label>
      <input type="email" class="auth-input" id="forgot-email" placeholder="you@example.com" required />

      <div class="auth-error" id="forgot-error"></div>

      <button type="submit" class="btn-auth-primary" id="forgot-submit-btn">
        <span id="forgot-submit-label">Send Reset Link</span>
        <i class="fa-solid fa-spinner fa-spin modal-spinner" id="forgot-spinner"></i>
      </button>
    </form>

    <p class="auth-switch">Remembered it? <a href="login.html">Log in</a></p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('forgot-error');
        const btn = document.getElementById('forgot-submit-btn');
        const emailInput = document.getElementById('forgot-email');
        errorEl.textContent = '';

        const email = emailInput.value.trim();
        if (!email) {
          errorEl.textContent = 'Enter your email.';
          return;
        }

        btn.disabled = true;
        btn.classList.add('loading');

        try {
          const client = window.getSupabaseClient();
          const redirectTo = window.location.origin + window.location.pathname.replace('forgot-password.html', 'update-password.html');
          const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
          if (error) throw error;

          errorEl.style.color = '#00b894';
          errorEl.textContent = 'Check your email for a reset link.';
          emailInput.value = '';
        } catch (err) {
          console.error('Reset password error:', err);
          errorEl.style.color = '#ff4757';
          errorEl.textContent = err?.message || 'Failed to send reset link. Please try again.';
        } finally {
          btn.disabled = false;
          btn.classList.remove('loading');
        }
      });
    })();
  </script>
</body>
</html>

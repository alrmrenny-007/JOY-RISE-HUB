<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply saved theme instantly, before first paint, to avoid a
    // flash of the wrong theme on load.
    (function () {
      try {
        if (localStorage.getItem('joyrise_theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Draw — Joy-Rise Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c5ce7" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .draw-hero {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 20px; padding: 24px 20px; text-align: center; color: #fff;
      position: relative; overflow: hidden; margin-bottom: 16px;
    }
    .draw-hero .live-tag { background: rgba(255,255,255,0.18); }
    .draw-hero h2 { font-size: 18px; margin: 10px 0 4px; }
    .draw-hero p { font-size: 12.5px; opacity: 0.9; margin: 0 0 18px; }
    .countdown-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .countdown-box {
      background: rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 14px; min-width: 56px;
    }
    .countdown-box strong { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    .countdown-box span { font-size: 9.5px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.06em; }
    .entries-pill {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
      background: rgba(255,255,255,0.15); padding: 7px 14px; border-radius: 20px; font-size: 12px;
    }
    .entries-pill strong { font-size: 13px; }
    .draw-hero.drawn { background: linear-gradient(135deg, #00b894, #55efc4); }
    .draw-hero .trophy-burst { font-size: 40px; margin-bottom: 4px; }

    .confetti-piece {
      position: absolute; top: 10%; width: 7px; height: 12px; border-radius: 2px;
      pointer-events: none; animation: confetti-fall 1400ms ease-in forwards;
    }
    @keyframes confetti-fall {
      to { transform: translate(var(--x), 220px) rotate(var(--rot)); opacity: 0; }
    }

    .telegram-secondary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 12px;
      font-size: 12.5px; color: #636e72; margin: 4px 0 16px; text-decoration: none;
    }
    .telegram-secondary i { color: #229ED9; }
    .telegram-secondary strong { color: #2d2d3f; }

    /* ---- TICKET REEL ---- */
    #reel-section {
      background: #1e1e2f;
      border-radius: 18px;
      padding: 18px 0 20px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .reel-title {
      color: #fff; font-size: 13px; font-weight: 700;
      text-align: center; margin-bottom: 14px; opacity: 0.85;
    }
    .reel-viewport {
      position: relative;
      height: 84px;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
    }
    .reel-pointer {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 3px; height: 100%; background: #fdcb6e; z-index: 5;
      box-shadow: 0 0 10px #fdcb6e;
    }
    .reel-track {
      position: absolute; top: 0; left: 50%; height: 100%;
      display: flex; align-items: center; gap: 8px;
      will-change: transform;
    }
    .reel-card {
      flex: 0 0 auto;
      width: 74px; height: 74px;
      background: #2d2d44;
      border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px;
      border: 2px solid rgba(255,255,255,0.08);
      filter: blur(0px);
      transition: filter 280ms ease-out;
    }
    .reel-track.spinning .reel-card {
      filter: blur(1.4px);
    }
    .reel-card img {
      width: 30px; height: 30px; border-radius: 50%;
      background: #fff;
    }
    .reel-card small {
      color: #b2b2c8; font-size: 8.5px; font-weight: 700;
      max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .reel-card.reel-winner-card {
      background: linear-gradient(160deg, #fdcb6e, #f59f00);
      border-color: #fff;
    }
    .reel-card.reel-winner-card small { color: #4a3200; }

    @keyframes reelCardPop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .reel-card-pop {
      animation: reelCardPop 420ms ease-out;
    }
    @keyframes reelPointerPulse {
      0%   { box-shadow: 0 0 10px #fdcb6e; }
      50%  { box-shadow: 0 0 22px 6px #fdcb6e; }
      100% { box-shadow: 0 0 10px #fdcb6e; }
    }
    .reel-pointer.pulse {
      animation: reelPointerPulse 420ms ease-out;
    }
  </style>
</head>
<body>

  <div class="mobile-container">

    <header class="app-header">
      <div class="logo-box">
        <button class="icon-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="logo-text" style="margin-left:8px;">
          <span class="brand-name">LIVE DRAW</span>
          <span class="brand-sub">Tonight's Draw</span>
        </div>
      </div>
    </header>

    <main class="main-content">

      <div class="draw-hero" id="draw-hero">
        <span class="live-tag"><span class="green-dot"></span> <span id="hero-tag">LIVE DRAW</span></span>
        <div id="hero-body">
          <h2>Loading tonight's draw...</h2>
        </div>
      </div>

      <div id="reel-section" style="display:none;">
        <div class="reel-title">Picking tonight's winner...</div>
        <div class="reel-viewport">
          <div class="reel-pointer"></div>
          <div class="reel-track" id="reel-track"></div>
        </div>
      </div>

      <a href="https://t.me/+fPu591BuqSRiYTY0" target="_blank" class="telegram-secondary">
        <i class="fa-brands fa-telegram"></i>
        Also watch it happen live on <strong>Telegram</strong>
      </a>

      <div id="winners-section" style="display:none;">
        <div class="section-title-flex">
          <h3>Tonight's Winners</h3>
          <a href="winners.html" style="font-size:11.5px; color:#6c5ce7; font-weight:600;">Past Winners <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i></a>
        </div>
        <div id="winners-list" class="winners-list"></div>
      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      document.getElementById('back-btn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // 8:00 PM WAT = 19:00 UTC, matches the scheduled draw job — see
      // 05_automate_daily_draw.sql
      function nextDrawUTC() {
        const now = new Date();
        const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 19, 0, 0));
        if (now.getTime() >= next.getTime()) next.setUTCDate(next.getUTCDate() + 1);
        return next;
      }

      let countdownTimer = null;
      let hasCelebrated = false;
      function startCountdown() {
        const target = nextDrawUTC();
        if (countdownTimer) clearInterval(countdownTimer);
        function tick() {
          const diff = Math.max(0, target.getTime() - Date.now());
          const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
          const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
          const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
          const box = document.getElementById('countdown-values');
          if (box) box.textContent = `${h}:${m}:${s}`;
        }
        tick();
        countdownTimer = setInterval(tick, 1000);
      }

      function renderWaiting(entries) {
        hasCelebrated = false;
        document.getElementById('draw-hero').classList.remove('drawn');
        document.getElementById('hero-tag').textContent = 'LIVE DRAW';
        document.getElementById('hero-body').innerHTML = `
          <h2>Tonight's draw is coming up</h2>
          <p>Every ticket bought today is already entered</p>
          <div class="countdown-row">
            <div class="countdown-box"><strong id="countdown-values">--:--:--</strong><span>Until 8:00 PM</span></div>
          </div>
          <div class="entries-pill"><i class="fa-solid fa-ticket"></i> <strong id="entries-count">${entries}</strong> ticket${entries === 1 ? '' : 's'} entered tonight</div>
        `;
        startCountdown();
        document.getElementById('winners-section').style.display = 'none';
      }

      function celebrate() {
        const hero = document.getElementById('draw-hero');
        const colors = ['#ffffff', '#ffeaa7', '#fab1a0', '#55efc4'];
        for (let i = 0; i < 20; i++) {
          const p = document.createElement('span');
          p.className = 'confetti-piece';
          p.style.setProperty('--x', (Math.random() * 240 - 120) + 'px');
          p.style.setProperty('--rot', (Math.random() * 360) + 'deg');
          p.style.left = (10 + Math.random() * 80) + '%';
          p.style.background = colors[i % colors.length];
          hero.appendChild(p);
          setTimeout(() => p.remove(), 1500);
        }
      }

      // Renders the final "N winners tonight" hero + winners list.
      // Used both for late viewers (instantly) and for live viewers
      // (after the reel animation finishes).
      function showFinalDrawnState(winners, shouldCelebrate) {
        if (countdownTimer) clearInterval(countdownTimer);
        const hero = document.getElementById('draw-hero');
        hero.classList.add('drawn');
        document.getElementById('hero-tag').textContent = 'DRAWN';

        const totalPrize = winners.reduce((sum, w) => sum + Number(w.prize_amount), 0);
        document.getElementById('hero-body').innerHTML = `
          <div class="trophy-burst">🏆</div>
          <h2>${winners.length} winner${winners.length > 1 ? 's' : ''} tonight!</h2>
          <p>₦${totalPrize.toLocaleString('en-NG', { minimumFractionDigits: 2 })} paid out</p>
          <div class="countdown-row">
            <div class="countdown-box"><strong id="countdown-values">--:--:--</strong><span>Next draw in</span></div>
          </div>
        `;
        startCountdown();

        if (shouldCelebrate) {
          setTimeout(() => celebrate(), 150);
        }

        const listEl = document.getElementById('winners-list');
        listEl.innerHTML = winners.map(w => `
          <div class="winner-row">
            <div class="winner-avatar"><i class="fa-solid fa-trophy"></i></div>
            <div class="winner-info">
              <strong>${escapeHtml(w.display_name || 'A Winner')}</strong>
              <small>${escapeHtml(w.tier_name || 'Ticket')}</small>
            </div>
            <div class="winner-prize">&#8358;${Number(w.prize_amount).toLocaleString('en-NG', { minimumFractionDigits: 2 })}</div>
          </div>
        `).join('');
        document.getElementById('winners-section').style.display = 'block';
      }

      // ---- REEL TUNING KNOBS ----
      // Change any of these numbers to adjust the feel of the draw
      // reel — nothing else in the code below needs to be touched.
      const REEL_CONFIG = {
        CARD_WIDTH: 74,
        CARD_GAP: 8,
        LOOPS_FIRST: 3,        // full laps around the reel before the first winner lands
        LOOPS_BETWEEN: 1,      // laps between each additional winner (for multi-winner draws)
        FIRST_SPIN_MIN_MS: 2600,  // shortest the opening spin can be (small draws)
        FIRST_SPIN_MAX_MS: 6500,  // longest the opening spin can be (big draws)
        BETWEEN_SPIN_MS: 1300,    // duration of each follow-up spin to the next winner
        PAUSE_AFTER_WIN_MS: 1100, // pause on a winner before spinning to the next one
        PAUSE_AFTER_LAST_MS: 900, // pause on the final winner before the reel hides
        BLUR_CLEAR_BEFORE_LANDING_MS: 450, // motion blur clears this long before it stops
      };
      // ---- END REEL TUNING KNOBS ----

      // Builds and animates the ticket-by-ticket reel. Handles ANY
      // number of winners: it spins to the first winner, pauses and
      // highlights them, then does a shorter follow-up spin to the
      // next winner, and so on — one continuous strip, never resetting
      // to the start between winners. All winners are already decided
      // server-side by get_draw_reel() before this ever runs — this
      // only reveals results that already exist, never generates one.
      function animateMultiWinnerReel(reel, winnerTargets) {
        return new Promise((resolve) => {
          const section = document.getElementById('reel-section');
          const titleEl = section.querySelector('.reel-title');
          const pointerEl = section.querySelector('.reel-pointer');
          const track = document.getElementById('reel-track');
          section.style.display = 'block';
          titleEl.textContent = winnerTargets.length > 1
            ? `Picking winner 1 of ${winnerTargets.length}...`
            : "Picking tonight's winner...";
          track.innerHTML = '';
          track.classList.remove('spinning');
          track.style.transition = 'none';
          track.style.transform = 'translateX(0px)';

          const { CARD_WIDTH: CARD_W, CARD_GAP: GAP } = REEL_CONFIG;
          const STEP = CARD_W + GAP;

          // Build one continuous sequence of cards covering every
          // winner's reveal, one after another, always moving forward
          // (never jumping backward through the strip).
          const displaySeq = [];
          const landings = [];
          winnerTargets.forEach((target, i) => {
            const loopsToAdd = i === 0 ? REEL_CONFIG.LOOPS_FIRST : REEL_CONFIG.LOOPS_BETWEEN;
            for (let l = 0; l < loopsToAdd; l++) displaySeq.push(...reel);
            displaySeq.push(...reel.slice(0, target.idx + 1));
            landings.push(displaySeq.length - 1);
          });

          displaySeq.forEach((t) => {
            const card = document.createElement('div');
            card.className = 'reel-card';
            const seed = encodeURIComponent(t.display_name || 'Player');
            const avatarSrc = t.avatar_url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}`;
            const firstName = (t.display_name || 'Player').split(' ')[0];
            card.innerHTML = `<img src="${avatarSrc}" alt="" /><small>${escapeHtml(firstName)}</small>`;
            track.appendChild(card);
          });

          // Force layout flush so the very first transition actually
          // animates from translateX(0) instead of jumping instantly.
          void track.offsetWidth;

          const allCards = track.querySelectorAll('.reel-card');

          function runSegment(segmentIdx) {
            if (segmentIdx >= landings.length) {
              resolve();
              return;
            }

            const landingIndex = landings[segmentIdx];
            const isFirst = segmentIdx === 0;
            const finalOffset = -(landingIndex * STEP + CARD_W / 2);
            const duration = isFirst
              ? Math.min(REEL_CONFIG.FIRST_SPIN_MAX_MS, Math.max(REEL_CONFIG.FIRST_SPIN_MIN_MS, landingIndex * 14))
              : REEL_CONFIG.BETWEEN_SPIN_MS;

            if (winnerTargets.length > 1 && segmentIdx > 0) {
              titleEl.textContent = `Picking winner ${segmentIdx + 1} of ${winnerTargets.length}...`;
            }

            // Motion blur while it's flying past cards, clearing to
            // sharp focus just before it settles on the winner — this
            // is what makes it read as "fast" rather than just "sliding".
            track.classList.add('spinning');
            const blurClearAt = Math.max(0, duration - REEL_CONFIG.BLUR_CLEAR_BEFORE_LANDING_MS);
            setTimeout(() => track.classList.remove('spinning'), blurClearAt);

            // easeOutExpo — a fast start with a long, satisfying
            // slowdown. This is the standard curve for slot-machine /
            // prize-reveal style animations.
            track.style.transition = `transform ${duration}ms cubic-bezier(0.16, 1, 0.3, 1)`;
            requestAnimationFrame(() => {
              track.style.transform = `translateX(${finalOffset}px)`;
            });

            setTimeout(() => {
              const landedCard = allCards[landingIndex];
              landedCard.classList.add('reel-winner-card', 'reel-card-pop');
              pointerEl.classList.add('pulse');
              setTimeout(() => pointerEl.classList.remove('pulse'), 450);

              const target = winnerTargets[segmentIdx];
              const prizeStr = Number(target.prize_amount).toLocaleString('en-NG', { minimumFractionDigits: 2 });
              titleEl.textContent = `🎉 ${target.display_name || 'A Winner'} — ₦${prizeStr}`;

              const pause = segmentIdx === winnerTargets.length - 1
                ? REEL_CONFIG.PAUSE_AFTER_LAST_MS
                : REEL_CONFIG.PAUSE_AFTER_WIN_MS;
              setTimeout(() => runSegment(segmentIdx + 1), pause);
            }, duration + 150);
          }

          runSegment(0);
        });
      }

      async function playReelThenReveal(client, winners, todayStr) {
        try {
          const { data: reel, error } = await client.rpc('get_draw_reel', { p_draw_date: todayStr });
          if (error) throw error;
          if (reel && reel.length > 0) {
            const winnerTargets = reel
              .map((t, idx) => ({ ...t, idx }))
              .filter((t) => t.is_winner);
            if (winnerTargets.length > 0) {
              await animateMultiWinnerReel(reel, winnerTargets);
            }
          }
        } catch (err) {
          // If the reel can't be loaded for any reason, don't block
          // the reveal — just skip straight to the result.
          console.warn('Reel animation skipped:', err);
        }
        document.getElementById('reel-section').style.display = 'none';
        showFinalDrawnState(winners, true);
      }

      function renderDrawn(client, winners, isLiveTransition, todayStr) {
        if (isLiveTransition && !hasCelebrated) {
          hasCelebrated = true;
          playReelThenReveal(client, winners, todayStr);
        } else {
          showFinalDrawnState(winners, false);
        }
      }

      let lastKnownDrawn = null;

      async function loadDrawStatus(client) {
        const { data: statusRows } = await client.rpc('get_live_draw_status');
        const status = statusRows?.[0];
        if (!status) return;

        if (status.is_drawn) {
          const { data: recent } = await client.rpc('get_recent_winners', { p_limit: 30 });
          const todayStr = new Date().toISOString().slice(0, 10);
          const tonightsWinners = (recent || []).filter(w => w.draw_date === todayStr);
          const isLiveTransition = lastKnownDrawn === false; // was watching it flip
          renderDrawn(client, tonightsWinners.length ? tonightsWinners : recent?.slice(0, 1) || [], isLiveTransition, todayStr);
        } else {
          renderWaiting(status.entries_today);
        }
        lastKnownDrawn = status.is_drawn;
      }

      async function init() {
        const client = window.getSupabaseClient();
        if (!client) return;
        await loadDrawStatus(client);

        // Poll for the moment the draw actually happens (or resets
        // into a new day/cycle) — no manual refresh needed.
        setInterval(() => loadDrawStatus(client), 20000);
      }

      init();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Edit Profile — Joy-Rise Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c5ce7" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="mobile-container">

    <header class="app-header">
      <div class="logo-box">
        <button class="icon-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="logo-text" style="margin-left:8px;">
          <span class="brand-name">EDIT PROFILE</span>
          <span class="brand-sub">Name & Avatar</span>
        </div>
      </div>
    </header>

    <main class="main-content">

      <div class="profile-preview">
        <img id="preview-avatar" class="profile-preview-avatar" src="" alt="Avatar" />
        <div id="preview-name" class="profile-preview-name">Loading...</div>
      </div>

      <div class="admin-section">
        <h3 class="admin-section-title"><i class="fa-solid fa-user"></i> Display Name</h3>
        <input type="text" class="auth-input" id="name-input" placeholder="Your name" style="margin-top:10px;" />
        <div class="modal-error" id="name-error"></div>
      </div>

      <div class="admin-section">
        <h3 class="admin-section-title"><i class="fa-solid fa-camera"></i> Upload Your Own Photo</h3>
        <p style="font-size:12px; color:#636e72; margin:6px 0 12px;">
          Use a real photo instead of a cartoon avatar — it'll show up
          everywhere your avatar does now, including if you win a draw.
        </p>
        <input type="file" id="photo-upload-input" accept="image/*" style="display:none;" />
        <button type="button" id="photo-upload-btn" style="width:100%; padding:12px; border-radius:10px; border:1.5px solid #6c5ce7; background:#f3f0ff; color:#6c5ce7; font-weight:700; font-size:14px; cursor:pointer;">
          <i class="fa-solid fa-image"></i> Choose or Take a Photo
        </button>
        <div class="modal-error" id="photo-error"></div>
      </div>

      <div class="admin-section">
        <h3 class="admin-section-title"><i class="fa-solid fa-images"></i> Or Choose a Cartoon Avatar</h3>
        <div id="avatar-grid" class="avatar-grid"></div>
      </div>

      <button class="btn-auth-primary" id="save-btn" style="margin-top:4px;">
        <span id="save-label">Save Changes</span>
        <i class="fa-solid fa-spinner fa-spin modal-spinner" id="save-spinner"></i>
      </button>

      <div class="admin-section" style="margin-top:20px;">
        <h3 class="admin-section-title"><i class="fa-solid fa-lock"></i> Change Password</h3>
        <input type="password" class="auth-input" id="new-password-input" placeholder="New password (min 6 characters)" style="margin-top:10px;" autocomplete="new-password" />
        <input type="password" class="auth-input" id="confirm-password-input" placeholder="Confirm new password" style="margin-top:10px;" autocomplete="new-password" />
        <div class="modal-error" id="password-error"></div>
        <div class="modal-success" id="password-success" style="display:none; color:#00b894; font-size:12px; margin-top:6px;"></div>
        <button class="btn-auth-primary" id="password-save-btn" style="margin-top:12px;">
          <span id="password-save-label">Update Password</span>
          <i class="fa-solid fa-spinner fa-spin modal-spinner" id="password-save-spinner"></i>
        </button>
      </div>

    </main>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check toast-icon" id="toast-icon"></i>
    <span id="toast-message"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      document.getElementById('back-btn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      const AVATAR_SEEDS = ['Felix', 'Aneka', 'Milo', 'Zoe', 'Leo', 'Mia', 'Kai', 'Nora', 'Theo', 'Ivy', 'Max', 'Ruby'];
      const avatarUrl = (seed) => `https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}`;
      const isDicebearUrl = (url) => !!url && url.includes('dicebear.com');

      let currentUserId = null;
      let selectedAvatarSeed = AVATAR_SEEDS[0];
      // 'preset' = using one of the cartoon avatars below.
      // 'photo'  = using a real uploaded photo (either one already
      // saved on the profile, or a brand new file picked just now).
      let avatarMode = 'preset';
      let existingPhotoUrl = null;   // the photo URL already saved on this profile, if any
      let selectedPhotoFile = null;  // a NEW file picked this session, not yet uploaded
      let toastTimer = null;

      const toast = document.getElementById('toast');
      const toastIcon = document.getElementById('toast-icon');
      const toastMessage = document.getElementById('toast-message');

      function showToast(message, type = 'success') {
        clearTimeout(toastTimer);
        toastMessage.textContent = message;
        toast.classList.remove('error');
        toastIcon.className = 'fa-solid toast-icon ' + (type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check');
        if (type === 'error') toast.classList.add('error');
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
      }

      function seedFromUrl(url) {
        if (!url) return AVATAR_SEEDS[0];
        const match = url.match(/seed=([^&]+)/);
        return match ? decodeURIComponent(match[1]) : AVATAR_SEEDS[0];
      }

      function renderAvatarGrid() {
        const grid = document.getElementById('avatar-grid');
        grid.innerHTML = AVATAR_SEEDS.map(seed => `
          <button class="avatar-option ${avatarMode === 'preset' && seed === selectedAvatarSeed ? 'selected' : ''}" data-seed="${seed}">
            <img src="${avatarUrl(seed)}" alt="${seed}" />
          </button>
        `).join('');

        grid.querySelectorAll('.avatar-option').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedAvatarSeed = btn.dataset.seed;
            avatarMode = 'preset';
            selectedPhotoFile = null;
            grid.querySelectorAll('.avatar-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            updatePreview();
          });
        });
      }

      function updatePreview() {
        if (avatarMode === 'photo') {
          document.getElementById('preview-avatar').src = selectedPhotoFile
            ? URL.createObjectURL(selectedPhotoFile)
            : existingPhotoUrl;
        } else {
          document.getElementById('preview-avatar').src = avatarUrl(selectedAvatarSeed);
        }
        document.getElementById('preview-name').textContent = document.getElementById('name-input').value || 'Your Name';
      }

      async function init() {
        const client = window.getSupabaseClient();
        if (!client) return;

        const { data: { user }, error: authError } = await client.auth.getUser();
        if (authError || !user) {
          window.location.href = 'login.html';
          return;
        }
        currentUserId = user.id;

        const { data: profile, error } = await client
          .from('profiles')
          .select('full_name, avatar_url')
          .eq('id', currentUserId)
          .single();

        if (error) {
          showToast("Couldn't load your profile.", 'error');
          return;
        }

        document.getElementById('name-input').value = profile.full_name || '';

        if (isDicebearUrl(profile.avatar_url)) {
          avatarMode = 'preset';
          selectedAvatarSeed = seedFromUrl(profile.avatar_url);
        } else if (profile.avatar_url) {
          avatarMode = 'photo';
          existingPhotoUrl = profile.avatar_url;
        }

        renderAvatarGrid();
        updatePreview();

        document.getElementById('name-input').addEventListener('input', updatePreview);

        const photoInput = document.getElementById('photo-upload-input');
        const photoError = document.getElementById('photo-error');
        document.getElementById('photo-upload-btn').addEventListener('click', () => photoInput.click());
        photoInput.addEventListener('change', () => {
          const file = photoInput.files[0];
          photoError.textContent = '';
          if (!file) return;

          const nameLower = (file.name || '').toLowerCase();
          const isHeic = file.type === 'image/heic' || file.type === 'image/heif'
            || nameLower.endsWith('.heic') || nameLower.endsWith('.heif');
          if (isHeic) {
            photoError.textContent = 'iPhone HEIC photos can\'t be previewed here yet. In your phone\'s Camera settings, switch photo format to "Most Compatible" (JPEG), or choose an existing JPEG/PNG from your gallery instead.';
            return;
          }
          if (!file.type.startsWith('image/')) {
            photoError.textContent = 'Please choose an image file.';
            return;
          }
          if (file.size > 5 * 1024 * 1024) {
            photoError.textContent = 'Please choose an image under 5MB.';
            return;
          }
          selectedPhotoFile = file;
          avatarMode = 'photo';
          document.querySelectorAll('.avatar-option').forEach(b => b.classList.remove('selected'));
          updatePreview();
        });

        // If a preview image ever fails to actually render (corrupt
        // file, unsupported format that slipped past the check above,
        // or a broken/expired photo URL from a previous session),
        // show a clear message instead of a silently broken circle.
        document.getElementById('preview-avatar').addEventListener('error', () => {
          photoError.textContent = 'That photo couldn\'t be displayed — please try a different one (JPEG or PNG work best).';
        });
      }

      document.getElementById('save-btn').addEventListener('click', async () => {
        const client = window.getSupabaseClient();
        const nameInput = document.getElementById('name-input');
        const errorEl = document.getElementById('name-error');
        const btn = document.getElementById('save-btn');
        errorEl.textContent = '';

        const name = nameInput.value.trim();
        if (!name) {
          errorEl.textContent = 'Please enter a name.';
          return;
        }

        btn.disabled = true;
        btn.classList.add('loading');

        try {
          let avatarUrlToSave;

          if (avatarMode === 'photo') {
            if (selectedPhotoFile) {
              // A brand new photo was picked this session — upload it,
              // overwriting any previous photo this user had (upsert),
              // so we don't pile up old photos in storage over time.
              const ext = (selectedPhotoFile.name.split('.').pop() || 'jpg').toLowerCase();
              const path = `${currentUserId}/avatar.${ext}`;
              const { error: uploadError } = await client.storage
                .from('avatars')
                .upload(path, selectedPhotoFile, { upsert: true, contentType: selectedPhotoFile.type });
              if (uploadError) throw uploadError;

              const { data: publicUrlData } = client.storage.from('avatars').getPublicUrl(path);
              // Cache-bust so the new photo shows immediately everywhere
              // instead of a browser/CDN serving the old cached one at
              // the same URL.
              avatarUrlToSave = `${publicUrlData.publicUrl}?v=${Date.now()}`;
            } else {
              // Already using a saved photo, untouched this session.
              avatarUrlToSave = existingPhotoUrl;
            }
          } else {
            avatarUrlToSave = avatarUrl(selectedAvatarSeed);
          }

          const { error } = await client
            .from('profiles')
            .update({ full_name: name, avatar_url: avatarUrlToSave })
            .eq('id', currentUserId);

          if (error) throw error;

          showToast('Profile updated!');
          setTimeout(() => { window.location.href = 'index.html'; }, 900);
        } catch (err) {
          // A raw "Failed to fetch" almost always means the request
          // never reached the server at all — for photo uploads
          // specifically, that's most often a missing/misconfigured
          // storage bucket rather than a real network problem.
          if (err.message === 'Failed to fetch' && avatarMode === 'photo' && selectedPhotoFile) {
            errorEl.textContent = 'Could not upload your photo. Check your connection, or ask the app admin to confirm photo uploads are set up correctly.';
          } else {
            errorEl.textContent = err.message || 'Failed to save changes.';
          }
        } finally {
          btn.disabled = false;
          btn.classList.remove('loading');
        }
      });

      document.getElementById('password-save-btn').addEventListener('click', async () => {
        const client = window.getSupabaseClient();
        const newPasswordInput = document.getElementById('new-password-input');
        const confirmPasswordInput = document.getElementById('confirm-password-input');
        const errorEl = document.getElementById('password-error');
        const successEl = document.getElementById('password-success');
        const btn = document.getElementById('password-save-btn');
        errorEl.textContent = '';
        successEl.style.display = 'none';

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword.length < 6) {
          errorEl.textContent = 'Password must be at least 6 characters.';
          return;
        }
        if (newPassword !== confirmPassword) {
          errorEl.textContent = 'Passwords do not match.';
          return;
        }

        btn.disabled = true;
        btn.classList.add('loading');

        try {
          const { error } = await client.auth.updateUser({ password: newPassword });
          if (error) throw error;

          newPasswordInput.value = '';
          confirmPasswordInput.value = '';
          successEl.textContent = 'Password updated successfully!';
          successEl.style.display = 'block';
        } catch (err) {
          errorEl.textContent = err.message || 'Failed to update password.';
        } finally {
          btn.disabled = false;
          btn.classList.remove('loading');
        }
      });

      init();
    })();
  </script>
</body>
</html>

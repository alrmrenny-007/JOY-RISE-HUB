<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transactions — Joy-Rise Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c5ce7" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="mobile-container">

    <header class="app-header">
      <div class="logo-box">
        <button class="icon-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="logo-text" style="margin-left:8px;">
          <span class="brand-name">TRANSACTIONS</span>
          <span class="brand-sub">Your Activity</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="txn-filter-row" id="txn-filter-row">
        <button class="txn-filter-chip active" data-filter="all">All</button>
        <button class="txn-filter-chip" data-filter="deposit">Deposits</button>
        <button class="txn-filter-chip" data-filter="withdrawal">Withdrawals</button>
        <button class="txn-filter-chip" data-filter="ticket_purchase">Tickets</button>
        <button class="txn-filter-chip" data-filter="referral_bonus">Referrals</button>
        <button class="txn-filter-chip" data-filter="win_payout">Winnings</button>
      </div>

      <div id="txn-list" class="winners-list"></div>
      <div id="txn-empty" class="winners-empty" style="display:none;">
        <i class="fa-solid fa-receipt"></i>
        <p>No transactions yet. Once you deposit, buy a ticket, or refer someone, it'll show up here.</p>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      document.getElementById('back-btn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      let allTxns = [];

      const TYPE_META = {
        deposit:            { icon: 'fa-circle-plus',       color: '#00b894', label: 'Deposit',            sign: '+' },
        withdrawal:         { icon: 'fa-circle-arrow-down', color: '#ff7675', label: 'Withdrawal',          sign: '-' },
        ticket_purchase:    { icon: 'fa-ticket',            color: '#6c5ce7', label: 'Ticket Purchase',    sign: '-' },
        referral_bonus:     { icon: 'fa-users',             color: '#00b894', label: 'Referral Bonus',     sign: '+' },
        win_payout:         { icon: 'fa-trophy',            color: '#f59f00', label: 'Draw Winnings',      sign: '+' },
        signup_bonus:       { icon: 'fa-gift',               color: '#f59f00', label: 'Signup Credit',      sign: '+' },
        withdrawal_reversal:{ icon: 'fa-rotate-left',        color: '#00b894', label: 'Withdrawal Refunded', sign: '+' },
      };

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function walletLabel(wallet) {
        return wallet === 'winnings' ? 'main' : wallet;
      }

      function render(filter) {
        const listEl = document.getElementById('txn-list');
        const emptyEl = document.getElementById('txn-empty');

        const rows = filter === 'all' ? allTxns : allTxns.filter(t => t.type === filter);

        if (rows.length === 0) {
          listEl.innerHTML = '';
          emptyEl.style.display = 'flex';
          return;
        }
        emptyEl.style.display = 'none';

        listEl.innerHTML = rows.map(t => {
          const meta = TYPE_META[t.type] || { icon: 'fa-circle', color: '#636e72', label: t.type, sign: '' };
          const date = new Date(t.created_at).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
          const statusBadge = t.status !== 'completed'
            ? `<span class="txn-status-badge txn-status-${escapeHtml(t.status)}">${escapeHtml(t.status)}</span>` : '';

          let extraLine = '';
          if (t.type === 'withdrawal' && t.status === 'completed' && t.payment_reference) {
            extraLine = `<small style="color:#00b894;"><i class="fa-solid fa-receipt"></i> Ref: ${escapeHtml(t.payment_reference)}</small>`;
          } else if (t.type === 'withdrawal' && t.status === 'failed' && t.rejection_reason) {
            extraLine = `<small style="color:#ff4757;"><i class="fa-solid fa-circle-info"></i> ${escapeHtml(t.rejection_reason)}</small>`;
          }

          return `
            <div class="winner-row">
              <div class="winner-avatar" style="background:${meta.color}1a; color:${meta.color};">
                <i class="fa-solid ${meta.icon}"></i>
              </div>
              <div class="winner-info">
                <strong>${meta.label} ${statusBadge}</strong>
                <small>${date} &middot; ${walletLabel(t.wallet)} wallet</small>
                ${extraLine}
              </div>
              <div class="winner-prize" style="color:${meta.sign === '-' ? '#ff7675' : '#00b894'};">
                ${meta.sign}&#8358;${Number(t.amount).toLocaleString('en-NG', { minimumFractionDigits: 2 })}
              </div>
            </div>
          `;
        }).join('');
      }

      function skeletonRows(count) {
        return Array.from({ length: count }).map(() => `
          <div class="skeleton-row">
            <div class="skeleton skeleton-avatar"></div>
            <div class="skeleton-lines">
              <div class="skeleton" style="width:50%; height:11px;"></div>
              <div class="skeleton" style="width:30%; height:9px;"></div>
            </div>
            <div class="skeleton" style="width:44px; height:14px;"></div>
          </div>
        `).join('');
      }

      async function loadTransactions() {
        const client = window.getSupabaseClient();
        if (!client) return;

        const { data: { user }, error: authError } = await client.auth.getUser();
        if (authError || !user) {
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('txn-list').innerHTML = skeletonRows(6);

        const { data, error } = await client
          .from('transactions')
          .select('id, type, wallet, amount, status, created_at, payment_reference, rejection_reason')
          .eq('user_id', user.id)
          .order('created_at', { ascending: false })
          .limit(100);

        if (error) {
          console.error('Error loading transactions:', error.message);
          document.getElementById('txn-list').innerHTML = '';
          document.getElementById('txn-empty').style.display = 'flex';
          return;
        }

        allTxns = data || [];
        render('all');
      }

      document.getElementById('txn-filter-row').addEventListener('click', (e) => {
        const chip = e.target.closest('.txn-filter-chip');
        if (!chip) return;
        document.querySelectorAll('.txn-filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        render(chip.dataset.filter);
      });

      loadTransactions();
    })();
  </script>
</body>
</html>

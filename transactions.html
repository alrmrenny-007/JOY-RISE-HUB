<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply saved theme instantly, before first paint, to avoid a
    // flash of the wrong theme on load.
    (function () {
      try {
        if (localStorage.getItem('joyrise_theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transactions — Joy-Rise Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c5ce7" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ---- Receipt card (deliberately theme-independent — a receipt
       should look like a printed receipt whether the app is in light
       or dark mode, especially once it's downloaded/shared out of
       context as an image). ---- */
    .receipt-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; padding: 5px 0 0; margin: 0;
      color: #6c5ce7; font-size: 11.5px; font-weight: 700; cursor: pointer;
      position: relative;
    }
    .receipt-btn::after { content: ''; position: absolute; inset: -8px 0; }
    html[data-theme="dark"] .receipt-btn { color: #9B8CFF; }

    #receipt-modal-overlay .modal-card { max-height: 88vh; overflow-y: auto; }

    .receipt-card {
      background: #ffffff; color: #1e1e24; border-radius: 16px;
      padding: 22px 20px; position: relative;
      background-image:
        radial-gradient(circle at 0 50%, transparent 9px, #fff 9.5px),
        radial-gradient(circle at 100% 50%, transparent 9px, #fff 9.5px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    }
    .receipt-head { text-align: center; margin-bottom: 14px; }
    .receipt-logo {
      width: 40px; height: 40px; border-radius: 12px; margin: 0 auto 8px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff; font-weight: 900; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .receipt-head h3 { font-size: 13px; font-weight: 800; color: #1e1e24; }
    .receipt-head span { font-size: 10.5px; color: #9089b0; text-transform: uppercase; letter-spacing: 0.08em; }

    .receipt-divider {
      border: none; border-top: 2px dashed #e4dff5; margin: 14px 0;
    }

    .receipt-amount { text-align: center; margin-bottom: 4px; }
    .receipt-amount strong { font-size: 26px; font-weight: 900; display: block; }
    .receipt-amount span { font-size: 11.5px; color: #9089b0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }

    .receipt-rows { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
    .receipt-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
    .receipt-row span:first-child { color: #9089b0; }
    .receipt-row span:last-child { color: #1e1e24; font-weight: 700; text-align: right; }
    .receipt-tickets-wrap { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; max-width: 65%; }
    .receipt-tickets-wrap span {
      background: #f3f0ff; color: #6c5ce7; font-size: 10px; font-weight: 800;
      padding: 3px 7px; border-radius: 7px;
    }

    .receipt-foot { text-align: center; margin-top: 16px; }
    .receipt-foot small { font-size: 10px; color: #b2bec3; }

    .receipt-actions { display: flex; gap: 10px; margin-top: 18px; }
    .receipt-actions button { flex: 1; }
  </style>
</head>
<body>

  <div class="mobile-container">

    <header class="app-header">
      <div class="logo-box">
        <button class="icon-btn" id="back-btn" aria-label="Go back"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="logo-text" style="margin-left:8px;">
          <span class="brand-name">TRANSACTIONS</span>
          <span class="brand-sub">Your Activity</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="txn-filter-row" id="txn-filter-row">
        <button class="txn-filter-chip active" data-filter="all">All</button>
        <button class="txn-filter-chip" data-filter="deposit">Deposits</button>
        <button class="txn-filter-chip" data-filter="withdrawal">Withdrawals</button>
        <button class="txn-filter-chip" data-filter="ticket_purchase">Tickets</button>
        <button class="txn-filter-chip" data-filter="referral_bonus">Referrals</button>
        <button class="txn-filter-chip" data-filter="win_payout">Winnings</button>
      </div>

      <div id="txn-list" class="winners-list"></div>
      <div id="txn-empty" class="winners-empty" style="display:none;">
        <i class="fa-solid fa-receipt"></i>
        <p>No transactions yet. Once you deposit, buy a ticket, or refer someone, it'll show up here.</p>
      </div>
    </main>

  </div>

  <!-- RECEIPT MODAL -->
  <div class="modal-overlay" id="receipt-modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-icon-circle"><i class="fa-solid fa-file-invoice"></i></div>
        <div>
          <h3>Receipt</h3>
          <p>Download or share this record</p>
        </div>
        <button class="modal-close-btn" id="receipt-close-btn" aria-label="Close dialog">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="receipt-card" id="receipt-card"></div>

        <div class="receipt-actions">
          <button class="btn-modal-cancel" id="receipt-download-btn">
            <i class="fa-solid fa-download"></i> Download
          </button>
          <button class="btn-modal-primary" id="receipt-share-btn">
            <i class="fa-solid fa-share-nodes"></i> Share
          </button>
        </div>
        <div id="receipt-status" style="margin-top:10px; font-size:12px; text-align:center; color:#636e72;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      document.getElementById('back-btn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      let allTxns = [];

      const TYPE_META = {
        deposit:            { icon: 'fa-circle-plus',       color: '#00b894', label: 'Deposit',            sign: '+' },
        withdrawal:         { icon: 'fa-circle-arrow-down', color: '#ff7675', label: 'Withdrawal',          sign: '-' },
        ticket_purchase:    { icon: 'fa-ticket',            color: '#6c5ce7', label: 'Ticket Purchase',    sign: '-' },
        referral_bonus:     { icon: 'fa-users',             color: '#00b894', label: 'Referral Bonus',     sign: '+' },
        win_payout:         { icon: 'fa-trophy',            color: '#f59f00', label: 'Draw Winnings',      sign: '+' },
        signup_bonus:       { icon: 'fa-gift',               color: '#f59f00', label: 'Signup Credit',      sign: '+' },
        withdrawal_reversal:{ icon: 'fa-rotate-left',        color: '#00b894', label: 'Withdrawal Refunded', sign: '+' },
        ticket_refund:      { icon: 'fa-ticket',             color: '#00b894', label: 'Ticket Refunded',    sign: '+' },
        creator_milestone_bonus: { icon: 'fa-crown',          color: '#f59f00', label: 'Creator Milestone Bonus', sign: '+' },
      };

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function walletLabel(wallet) {
        return wallet === 'winnings' ? 'main' : wallet;
      }

      function fmtTicketCode(n) {
        return 'TK-' + String(n).padStart(4, '0');
      }

      // Builds the ticket-number summary for a purchase. Ticket
      // numbers come from a single sequence shared across ALL users,
      // so if someone else's purchase happened in between yours, your
      // numbers might not be perfectly back-to-back — this only shows
      // a "→" range when the numbers are genuinely contiguous, and
      // falls back to listing them individually otherwise, so it's
      // never misleading about which tickets are actually yours.
      function ticketSummary(numbers) {
        const sorted = [...numbers].sort((a, b) => a - b);
        if (sorted.length === 1) {
          return { inline: `#${fmtTicketCode(sorted[0])}`, expandable: false };
        }
        const isContiguous = sorted.every((n, i) => i === 0 || n === sorted[i - 1] + 1);
        const inline = isContiguous
          ? `#${fmtTicketCode(sorted[0])} → #${fmtTicketCode(sorted[sorted.length - 1])}`
          : `${sorted.length} tickets — tap to view`;
        return { inline, expandable: true, all: sorted };
      }

      function render(filter) {
        const listEl = document.getElementById('txn-list');
        const emptyEl = document.getElementById('txn-empty');

        const rows = filter === 'all' ? allTxns : allTxns.filter(t => t.type === filter);

        if (rows.length === 0) {
          listEl.innerHTML = '';
          emptyEl.style.display = 'flex';
          return;
        }
        emptyEl.style.display = 'none';

        listEl.innerHTML = rows.map((t, idx) => {
          const meta = TYPE_META[t.type] || { icon: 'fa-circle', color: '#636e72', label: t.type, sign: '' };
          const date = new Date(t.created_at).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
          const statusBadge = t.status !== 'completed'
            ? `<span class="txn-status-badge txn-status-${escapeHtml(t.status)}">${escapeHtml(t.status)}</span>`
            : (t.type === 'withdrawal' ? `<span class="txn-status-badge txn-status-completed">successful</span>` : '');

          let extraLine = '';
          if (t.type === 'withdrawal' && t.status === 'completed' && t.payment_reference) {
            extraLine = `<small style="color:#00b894;"><i class="fa-solid fa-receipt"></i> Ref: ${escapeHtml(t.payment_reference)}</small>`;
          } else if (t.type === 'withdrawal' && t.status === 'failed' && t.rejection_reason) {
            extraLine = `<small style="color:#ff4757;"><i class="fa-solid fa-circle-info"></i> ${escapeHtml(t.rejection_reason)}</small>`;
          }

          const ticketNumbers = (t.tickets || []).map(x => x.ticket_number).filter(n => n != null);
          let titleLabel = meta.label;
          let ticketLine = '';
          let expandPanel = '';
          let rowAttrs = '';

          if (t.type === 'ticket_purchase' && ticketNumbers.length > 0) {
            const summary = ticketSummary(ticketNumbers);
            if (ticketNumbers.length > 1) {
              titleLabel = `${ticketNumbers.length}x Tickets`;
            }
            ticketLine = `<small style="color:#6c5ce7; font-weight:700;"><i class="fa-solid fa-ticket"></i> ${summary.inline}</small>`;
            if (summary.expandable) {
              rowAttrs = `data-expandable="true" data-row-idx="${idx}"`;
              expandPanel = `
                <div class="ticket-expand-panel" id="ticket-expand-${idx}" style="display:none; padding:8px 14px 12px 62px; flex-wrap:wrap; gap:6px;">
                  ${summary.all.map(n => `<span style="background:#f3f0ff; color:#6c5ce7; font-size:11px; font-weight:700; padding:4px 8px; border-radius:8px;">#${fmtTicketCode(n)}</span>`).join('')}
                </div>
              `;
            }
          }

          if (t.type === 'win_payout') {
            const win = winDetailsMap.get(t.id);
            if (win) {
              ticketLine = `<small style="color:#f59f00; font-weight:700;"><i class="fa-solid fa-ticket"></i> ${fmtTicketCode(win.ticket_number)} &middot; Draw #${String(win.draw_number).padStart(3, '0')}</small>`;
              rowAttrs = `data-expandable="true" data-row-idx="${idx}"`;
              const drawTimeStr = new Date(win.draw_datetime).toLocaleString('en-NG', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
              expandPanel = `
                <div class="ticket-expand-panel" id="ticket-expand-${idx}" style="display:none; padding:4px 14px 14px 62px; flex-direction:column; gap:4px; font-size:12.5px; color:#2d3436;">
                  <div><strong>Draw:</strong> #${String(win.draw_number).padStart(3, '0')}</div>
                  <div><strong>Winning Ticket:</strong> ${fmtTicketCode(win.ticket_number)}</div>
                  <div><strong>Draw Time:</strong> ${drawTimeStr}</div>
                  <div><strong>Prize:</strong> &#8358;${Number(win.prize_amount).toLocaleString('en-NG', { minimumFractionDigits: 2 })}</div>
                  <div><strong>Status:</strong> ${t.status === 'completed' ? '✅ Credited to Main Wallet' : escapeHtml(t.status)}</div>
                </div>
              `;
            }
          }

          const receiptEligible = t.status === 'completed' && (
            t.type === 'ticket_purchase' || t.type === 'withdrawal' || t.type === 'win_payout' || t.type === 'creator_milestone_bonus'
          );
          const receiptBtn = receiptEligible
            ? `<button class="receipt-btn" data-txn-id="${t.id}" aria-label="View receipt"><i class="fa-solid fa-file-invoice"></i> View Receipt</button>`
            : '';

          return `
            <div class="winner-row" ${rowAttrs} style="${rowAttrs ? 'cursor:pointer;' : ''}">
              <div class="winner-avatar" style="background:${meta.color}1a; color:${meta.color};">
                <i class="fa-solid ${meta.icon}"></i>
              </div>
              <div class="winner-info">
                <strong>${titleLabel} ${statusBadge}</strong>
                <small>${date} &middot; ${walletLabel(t.wallet)} wallet</small>
                ${ticketLine}
                ${extraLine}
                ${receiptBtn}
              </div>
              <div class="winner-prize" style="color:${meta.sign === '-' ? '#ff7675' : '#00b894'};">
                ${meta.sign}&#8358;${Number(t.amount).toLocaleString('en-NG', { minimumFractionDigits: 2 })}
              </div>
              ${rowAttrs ? '<i class="fa-solid fa-chevron-down" style="color:#b2bec3; font-size:11px;"></i>' : ''}
            </div>
            ${expandPanel}
          `;
        }).join('');
      }

      function skeletonRows(count) {
        return Array.from({ length: count }).map(() => `
          <div class="skeleton-row">
            <div class="skeleton skeleton-avatar"></div>
            <div class="skeleton-lines">
              <div class="skeleton" style="width:50%; height:11px;"></div>
              <div class="skeleton" style="width:30%; height:9px;"></div>
            </div>
            <div class="skeleton" style="width:44px; height:14px;"></div>
          </div>
        `).join('');
      }

      let winDetailsMap = new Map();
      let myBankDetails = null;

      async function loadTransactions() {
        const client = window.getSupabaseClient();
        if (!client) return;

        const { data: { user }, error: authError } = await client.auth.getUser();
        if (authError || !user) {
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('txn-list').innerHTML = skeletonRows(6);

        const [txnsResult, winsResult, bankResult] = await Promise.all([
          client
            .from('transactions')
            .select('id, type, wallet, amount, status, created_at, payment_reference, rejection_reason, tickets(ticket_number)')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false })
            .limit(100),
          client.rpc('get_my_win_transactions'),
          client
            .from('profiles')
            .select('bank_name, account_number, account_name')
            .eq('id', user.id)
            .single(),
        ]);

        if (!bankResult.error && bankResult.data) {
          myBankDetails = bankResult.data;
        }

        if (txnsResult.error) {
          console.error('Error loading transactions:', txnsResult.error.message);
          document.getElementById('txn-list').innerHTML = '';
          document.getElementById('txn-empty').style.display = 'flex';
          return;
        }

        if (winsResult.error) {
          console.error('Error loading win details:', winsResult.error.message);
        } else {
          winDetailsMap = new Map((winsResult.data || []).map(w => [w.transaction_id, w]));
        }

        allTxns = txnsResult.data || [];
        render('all');
      }

      // ---- RECEIPTS: build a themed receipt card, then render it to a
      // PNG via html2canvas for the actual download/share (the PNG is
      // always light-background regardless of the app's current theme,
      // since a shared receipt should look right out of context). ----
      function fmtReceiptDate(iso) {
        return new Date(iso).toLocaleString('en-NG', {
          day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit',
        });
      }

      // Keeps the first 3 and last 3 digits visible, masks the rest —
      // enough to confirm the right account without showing it in full.
      function maskAccountNumber(num) {
        const s = String(num || '').replace(/\s+/g, '');
        if (s.length <= 6) return s;
        return s.slice(0, 3) + '*'.repeat(s.length - 6) + s.slice(-3);
      }

      // "JOHN ADEBAYO OKONKWO" -> "John A. Okonkwo"
      function shortenAccountName(name) {
        if (!name) return '';
        const titleCase = (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
        const parts = String(name).trim().split(/\s+/).filter(Boolean);
        if (parts.length <= 2) return parts.map(titleCase).join(' ');
        const first = titleCase(parts[0]);
        const last = titleCase(parts[parts.length - 1]);
        const middle = parts.slice(1, -1).map((p) => p.charAt(0).toUpperCase() + '.').join(' ');
        return `${first} ${middle} ${last}`;
      }

      function buildReceiptHTML(t) {
        const meta = TYPE_META[t.type] || { label: t.type, sign: '' };
        const amountStr = `${meta.sign}&#8358;${Number(t.amount).toLocaleString('en-NG', { minimumFractionDigits: 2 })}`;
        const rows = [];
        let title = meta.label;
        let refCode = t.id.slice(0, 8).toUpperCase();

        if (t.type === 'ticket_purchase') {
          title = 'Ticket Purchase';
          const numbers = (t.tickets || []).map(x => x.ticket_number).filter(n => n != null).sort((a, b) => a - b);
          refCode = numbers.length ? fmtTicketCode(numbers[0]) : refCode;
          rows.push(['Wallet used', walletLabel(t.wallet)]);
          if (numbers.length) {
            rows.push([
              numbers.length > 1 ? 'Ticket numbers' : 'Ticket number',
              `<div class="receipt-tickets-wrap">${numbers.map(n => `<span>#${fmtTicketCode(n)}</span>`).join('')}</div>`,
            ]);
          }
        } else if (t.type === 'withdrawal') {
          title = 'Withdrawal Payout';
          refCode = t.payment_reference || refCode;
          rows.push(['Reference', escapeHtml(refCode)]);
          if (myBankDetails && myBankDetails.account_number && myBankDetails.bank_name) {
            rows.push(['Recipient', escapeHtml(shortenAccountName(myBankDetails.account_name))]);
            rows.push(['Bank', escapeHtml(myBankDetails.bank_name)]);
            rows.push(['Account number', maskAccountNumber(myBankDetails.account_number)]);
          }
          rows.push(['Wallet', walletLabel(t.wallet)]);
        } else if (t.type === 'win_payout') {
          title = 'Draw Winnings Payout';
          const win = winDetailsMap.get(t.id);
          if (win) {
            refCode = fmtTicketCode(win.ticket_number);
            rows.push(['Draw', `#${String(win.draw_number).padStart(3, '0')}`]);
            rows.push(['Winning ticket', `#${fmtTicketCode(win.ticket_number)}`]);
            rows.push(['Draw time', fmtReceiptDate(win.draw_datetime)]);
          }
          rows.push(['Credited to', walletLabel(t.wallet) + ' wallet']);
        }

        rows.push(['Date', fmtReceiptDate(t.created_at)]);
        rows.push(['Status', t.status === 'completed' ? 'Completed ✅' : escapeHtml(t.status)]);

        return {
          refCode,
          html: `
            <div class="receipt-head">
              <div class="receipt-logo">JR</div>
              <h3>Joy-Rise Hub</h3>
              <span>Official Receipt</span>
            </div>
            <hr class="receipt-divider" />
            <div class="receipt-amount">
              <strong style="color:${meta.sign === '-' ? '#ff7675' : '#00b894'};">${amountStr}</strong>
              <span>${escapeHtml(title)}</span>
            </div>
            <hr class="receipt-divider" />
            <div class="receipt-rows">
              ${rows.map(([label, value]) => `
                <div class="receipt-row"><span>${label}</span><span>${value}</span></div>
              `).join('')}
            </div>
            <hr class="receipt-divider" />
            <div class="receipt-foot">
              <small>Ref: ${escapeHtml(refCode)} &middot; joyrisehub.com</small>
            </div>
          `,
        };
      }

      let currentReceiptRef = 'receipt';

      function openReceipt(txnId) {
        const t = allTxns.find(x => x.id === txnId);
        if (!t) return;
        const { refCode, html } = buildReceiptHTML(t);
        currentReceiptRef = refCode;
        document.getElementById('receipt-card').innerHTML = html;
        document.getElementById('receipt-status').textContent = '';
        document.getElementById('receipt-modal-overlay').classList.add('open');
      }

      function closeReceipt() {
        document.getElementById('receipt-modal-overlay').classList.remove('open');
      }

      async function renderReceiptToBlob() {
        const canvas = await html2canvas(document.getElementById('receipt-card'), {
          backgroundColor: '#ffffff',
          scale: 2,
        });
        return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
      }

      document.getElementById('receipt-close-btn').addEventListener('click', closeReceipt);
      document.getElementById('receipt-modal-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'receipt-modal-overlay') closeReceipt();
      });

      document.getElementById('receipt-download-btn').addEventListener('click', async () => {
        const statusEl = document.getElementById('receipt-status');
        statusEl.textContent = 'Preparing image...';
        try {
          const blob = await renderReceiptToBlob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `JoyRiseHub-Receipt-${currentReceiptRef}.png`;
          a.click();
          URL.revokeObjectURL(url);
          statusEl.textContent = 'Downloaded.';
        } catch (err) {
          statusEl.textContent = 'Could not generate the receipt image.';
        }
      });

      document.getElementById('receipt-share-btn').addEventListener('click', async () => {
        const statusEl = document.getElementById('receipt-status');
        statusEl.textContent = 'Preparing image...';
        try {
          const blob = await renderReceiptToBlob();
          const file = new File([blob], `JoyRiseHub-Receipt-${currentReceiptRef}.png`, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'Joy-Rise Hub Receipt',
              text: `My Joy-Rise Hub receipt — Ref: ${currentReceiptRef}`,
            });
            statusEl.textContent = '';
          } else {
            // Sharing images isn't supported here — fall back to a download
            // so the person can still get the file and share it manually.
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `JoyRiseHub-Receipt-${currentReceiptRef}.png`;
            a.click();
            URL.revokeObjectURL(url);
            statusEl.textContent = "Sharing isn't supported here — downloaded instead.";
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            statusEl.textContent = 'Could not share the receipt.';
          } else {
            statusEl.textContent = '';
          }
        }
      });

      document.getElementById('txn-filter-row').addEventListener('click', (e) => {
        const chip = e.target.closest('.txn-filter-chip');
        if (!chip) return;
        document.querySelectorAll('.txn-filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        render(chip.dataset.filter);
      });

      document.getElementById('txn-list').addEventListener('click', (e) => {
        const receiptBtn = e.target.closest('.receipt-btn');
        if (receiptBtn) {
          e.stopPropagation();
          openReceipt(receiptBtn.dataset.txnId);
          return;
        }

        const row = e.target.closest('[data-expandable="true"]');
        if (!row) return;
        const panel = document.getElementById(`ticket-expand-${row.dataset.rowIdx}`);
        if (!panel) return;
        const isOpen = panel.style.display === 'flex';
        panel.style.display = isOpen ? 'none' : 'flex';
        const chevron = row.querySelector('.fa-chevron-down, .fa-chevron-up');
        if (chevron) {
          chevron.classList.toggle('fa-chevron-down', isOpen);
          chevron.classList.toggle('fa-chevron-up', !isOpen);
        }
      });

      loadTransactions();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Set New Password — Joy-Rise Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c5ce7" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="mobile-container auth-container">

    <div class="auth-bg-decor">
      <span>🎟️</span>
      <span>🏆</span>
      <span>💰</span>
      <span>✨</span>
      <span>🎉</span>
      <span>🎁</span>
    </div>

    <div class="auth-header">
      <div class="logo-box">
        <div class="logo-badge">JR</div>
        <div class="logo-text">
          <span class="brand-name">JOY-RISE</span>
          <span class="brand-sub">HUB</span>
        </div>
      </div>
      <h1>Set a new password</h1>
      <p>Choose a new password for your account</p>
    </div>

    <div id="link-invalid" style="display:none;">
      <p style="font-size:12px; color:#ff4757; margin-bottom:16px;">
        This reset link is invalid or has expired. Please request a new one.
      </p>
      <a href="forgot-password.html" class="btn-auth-primary" style="text-decoration:none; display:flex;">
        <span>Request New Link</span>
      </a>
    </div>

    <form class="auth-form" id="update-form" style="display:none;">
      <label class="auth-label">New Password</label>
      <input type="password" class="auth-input" id="new-password" placeholder="At least 6 characters" required minlength="6" />

      <label class="auth-label">Confirm New Password</label>
      <input type="password" class="auth-input" id="confirm-password" placeholder="Re-enter your new password" required minlength="6" />

      <div class="auth-error" id="update-error"></div>

      <button type="submit" class="btn-auth-primary" id="update-submit-btn">
        <span id="update-submit-label">Update Password</span>
        <i class="fa-solid fa-spinner fa-spin modal-spinner" id="update-spinner"></i>
      </button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      let hasRecoverySession = false;

      async function init() {
        const client = window.getSupabaseClient();
        if (!client) return;

        // The reset-link redirect carries a recovery token that
        // supabase-js parses automatically from the URL on load,
        // firing this event once the recovery session is ready.
        client.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY' && session) {
            hasRecoverySession = true;
            document.getElementById('update-form').style.display = 'flex';
            document.getElementById('link-invalid').style.display = 'none';
          }
        });

        // Fallback: if we already have a session by the time this runs
        // (event may have fired before the listener was attached)
        const { data: { session } } = await client.auth.getSession();
        if (session && !hasRecoverySession) {
          hasRecoverySession = true;
          document.getElementById('update-form').style.display = 'flex';
          document.getElementById('link-invalid').style.display = 'none';
        }

        // Give the token a moment to parse before deciding the link is dead
        setTimeout(() => {
          if (!hasRecoverySession) {
            document.getElementById('link-invalid').style.display = 'block';
          }
        }, 2500);
      }

      document.getElementById('update-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('update-error');
        const btn = document.getElementById('update-submit-btn');
        errorEl.textContent = '';

        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword.length < 6) {
          errorEl.textContent = 'Password must be at least 6 characters.';
          return;
        }
        if (newPassword !== confirmPassword) {
          errorEl.textContent = 'Passwords do not match.';
          return;
        }

        btn.disabled = true;
        btn.classList.add('loading');

        try {
          const client = window.getSupabaseClient();
          const { error } = await client.auth.updateUser({ password: newPassword });
          if (error) throw error;

          errorEl.style.color = '#00b894';
          errorEl.textContent = 'Password updated! Redirecting to login...';
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        } catch (err) {
          console.error('Update password error:', err);
          errorEl.style.color = '#ff4757';
          errorEl.textContent = err?.message || 'Failed to update password.';
          btn.disabled = false;
          btn.classList.remove('loading');
        }
      });

      init();
    })();
  </script>
</body>
</html>
